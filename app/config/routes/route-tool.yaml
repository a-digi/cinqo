routes:
  # authenticated (not admin-only) — every signed-in user needs to know
  # which tools exist and are enabled to build their own menu correctly.
  - path: /api/v1/tools
    method: GET
    executor: ToolList
    security: authenticated

  - path: /api/v1/tools/install
    method: POST
    executor: ToolInstall
    security: authenticated
    scopes:
      - tool:manage
      - cinqo:super:admin

  - path: /api/v1/tools/{slug}
    method: DELETE
    executor: ToolDelete
    security: authenticated
    scopes:
      - tool:manage
      - cinqo:super:admin

  - path: /api/v1/tools/{slug}/enable
    method: POST
    executor: ToolEnable
    security: authenticated
    scopes:
      - tool:manage
      - cinqo:super:admin

  - path: /api/v1/tools/{slug}/disable
    method: POST
    executor: ToolDisable
    security: authenticated
    scopes:
      - tool:manage
      - cinqo:super:admin

  # Public — matches coco-mda's own reasoning for its equivalent
  # endpoint: the <script> tag request happens before the browser
  # necessarily has a warm session, and the bundle itself is static JS,
  # not sensitive data. Serving the file doesn't bypass anything else —
  # a tool's menu entry still goes through filterVisible's scope check,
  # and its backend calls still go through the proxy's own enforcement.
  - path: /api/v1/tools/{slug}/frontend-bundle
    method: GET
    executor: ToolFrontendBundle
    security: public

  # The reverse proxy to a tool's own backend. No static scopes: on
  # purpose — the actual requirement is dynamic (whatever scope the
  # tool itself declared for this specific path in its manifest, or
  # cinqo:super:admin), checked inside ToolProxyHandler, not something
  # this YAML can express. There is no literal "ANY" method in this
  # router (verified directly, not assumed — the matcher does a plain
  # string compare against the real HTTP method) — five separate
  # entries, one per verb, matching coco-mda's own real
  # route-plugin.yaml exactly.
  - path: /api/v1/tools/{slug}/proxy/**
    method: GET
    executor: ToolProxy
    security: authenticated
  - path: /api/v1/tools/{slug}/proxy/**
    method: POST
    executor: ToolProxy
    security: authenticated
  - path: /api/v1/tools/{slug}/proxy/**
    method: PUT
    executor: ToolProxy
    security: authenticated
  - path: /api/v1/tools/{slug}/proxy/**
    method: PATCH
    executor: ToolProxy
    security: authenticated
  - path: /api/v1/tools/{slug}/proxy/**
    method: DELETE
    executor: ToolProxy
    security: authenticated
