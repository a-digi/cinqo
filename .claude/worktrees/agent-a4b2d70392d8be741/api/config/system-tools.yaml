# Tools listed here can be enabled/disabled like any other tool, but
# DELETE /api/v1/tools/{slug} is refused for them — the application
# itself does not allow their removal. This file is the sole source of
# truth for that protection; nothing is persisted to the database, so
# it can never drift out of sync with what's written here.
#
# Absent or empty (as it is now) means no tool is protected — shipping
# the mechanism itself doesn't decide which tools, if any, should
# actually be protected. See
# plan/ai/tools/step-10-system-tools.md.
#
# system_tools:
#   - slug: pdf_generator
#     reason: "Ships with cinqo itself."

system_tools: []
