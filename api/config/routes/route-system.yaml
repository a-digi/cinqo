# What the computer is doing, for the resource bar under the top bar (api/src/system). Read-only; it needs its own read scope.
routes:
  - path: /api/v1/system/resources
    method: GET
    executor: SystemResourcesGet
    security: authenticated
    scopes:
      - cinqo:system:read
      - cinqo:super:admin

  # The applications that use the most memory (plan 226): names, the PID of each one's biggest process, and their summed resident size. The same read
  # scope as the bar; only command names are read, never command lines.
  - path: /api/v1/system/memory-top
    method: GET
    executor: SystemMemoryTopGet
    security: authenticated
    scopes:
      - cinqo:system:read
      - cinqo:super:admin

  # The record of unexpected stops (plan 223, step 5): read with the bar's scope; marking one as seen changes data, so it needs its own scope.
  - path: /api/v1/system/events
    method: GET
    executor: SystemEventsGet
    security: authenticated
    scopes:
      - cinqo:system:read
      - cinqo:super:admin

  # Plan 259: the unexpected stops as a dashboard. The list is paged (?page=&pageSize=) and has no evidence; the summary is what the bar and the dropdown read;
  # one stop has its evidence. All three are reads with the bar's scope. "summary" is a literal segment, so it wins over {id}.
  - path: /api/v1/system/events/summary
    method: GET
    executor: SystemEventsSummaryGet
    security: authenticated
    scopes:
      - cinqo:system:read
      - cinqo:super:admin

  - path: /api/v1/system/events/{id}
    method: GET
    executor: SystemEventGet
    security: authenticated
    scopes:
      - cinqo:system:read
      - cinqo:super:admin

  # Marking every unseen stop as seen changes data: the manage scope, like marking one.
  - path: /api/v1/system/events/acknowledge-all
    method: POST
    executor: SystemEventsAcknowledgeAll
    security: authenticated
    scopes:
      - cinqo:system:manage
      - cinqo:super:admin

  - path: /api/v1/system/events/{id}/acknowledge
    method: POST
    executor: SystemEventAcknowledge
    security: authenticated
    scopes:
      - cinqo:system:manage
      - cinqo:super:admin
